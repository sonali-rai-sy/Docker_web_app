version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tickets

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - my_net

  app:
    build:
      context: ./app

    container_name: ticket_app

    depends_on:
      - mysql

    networks:
      - my_net

  nginx:
    image: nginx:latest

    container_name: nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - my_net

networks:
  my_net:

volumes:
  mysql_data:
