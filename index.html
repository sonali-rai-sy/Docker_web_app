<!DOCTYPE html>
<html>
<head>
    <title>Docker Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: #007bff;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello Docker 🚀</h1>

        <h2>Sonali Rai</h2>

        <p>Current Role: System Engineer</p>

        <p>This page is running inside a Docker container.</p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Congratulations! Your Docker container is serving this page successfully.";
        }
    </script>

</body>
</html>
